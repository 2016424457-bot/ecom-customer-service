<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#1f3b2f" />
  <title>示例商城 · 售后客服</title>
  <link rel="stylesheet" href="/static/chat.css?v=8" />
</head>
<body>
  <div class="app-shell">
    <aside id="conversationSidebar" class="conversation-sidebar" aria-label="会话列表">
      <div class="sidebar-head">
        <span>会话</span>
        <button id="sidebarNewBtn" class="sidebar-new" type="button">＋ 新对话</button>
      </div>
      <div id="conversationList" class="conversation-list"></div>
    </aside>

    <div class="chat-main">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">客</div>
        <div class="brand-copy">
          <p class="brand-kicker">Customer Service</p>
          <h1>示例商城</h1>
          <p class="status-line">
            <span id="statusDot" class="status-dot" aria-hidden="true"></span>
            <span id="statusText">连接中…</span>
          </p>
        </div>
      </div>
      <button id="newChatBtn" class="ghost-btn" type="button">新对话</button>
    </header>

    <main id="messages" class="messages" role="log" aria-live="polite" aria-label="客服对话"></main>

    <div class="composer-wrap">
      <div id="suggestions" class="suggestions" aria-label="快捷问题">
        <button class="chip" type="button" data-message="我想退货，怎么操作？">我想退货</button>
        <button class="chip" type="button" data-message="我的订单到哪了？">查物流</button>
        <button class="chip" type="button" data-message="收到的商品有质量问题，想换货。">申请换货</button>
      </div>

      <form id="composer" class="composer">
        <textarea
          id="input"
          rows="1"
          maxlength="8000"
          placeholder="描述你的售后问题，例如订单号、商品问题和期望方案…"
          autocomplete="off"
          aria-label="输入消息"
        ></textarea>
        <button id="sendBtn" class="send-btn" type="submit" aria-label="发送消息">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path d="M3.4 20.4 21.2 12 3.4 3.6l2.7 7.1 9.1 1.3-9.1 1.3-2.7 7.1Z" fill="currentColor"></path>
          </svg>
        </button>
      </form>
      <p class="hint">Enter 发送 · Shift + Enter 换行</p>
    </div>
    </div>
  </div>

  <dialog id="ticketDialog" class="ticket-dialog">
    <form id="ticketForm" class="ticket-form" novalidate>
      <div class="source-head">
        <div>
          <p class="source-kicker">Ticket</p>
          <h2>创建工单</h2>
        </div>
        <button id="closeTicket" class="dialog-close" type="button" aria-label="关闭">×</button>
      </div>
      <label class="form-row">
        <span>反馈类别</span>
        <select id="ticketType" required>
          <option value="" disabled selected>请选择</option>
          <option value="售后">售后</option>
          <option value="投诉">投诉</option>
          <option value="咨询">咨询</option>
        </select>
      </label>
      <label class="form-row">
        <span>反馈描述</span>
        <textarea id="ticketDescription" rows="4" maxlength="4000" required placeholder="请描述您遇到的问题…"></textarea>
      </label>
      <p id="ticketError" class="form-error" role="alert"></p>
      <div class="ticket-actions">
        <button id="cancelTicket" class="action-btn" type="button">取消</button>
        <button id="submitTicket" class="action-btn primary" type="submit">提交工单</button>
      </div>
    </form>
  </dialog>

  <dialog id="refundDialog" class="refund-dialog">
    <form id="refundForm" class="ticket-form" novalidate>
      <div class="source-head">
        <div>
          <p class="source-kicker">Refund</p>
          <h2>提交退款申请</h2>
        </div>
        <button id="closeRefund" class="dialog-close" type="button" aria-label="关闭">×</button>
      </div>
      <div id="refundOrder" class="refund-order"></div>
      <label class="form-row">
        <span>退款原因</span>
        <select id="refundReason" required></select>
      </label>
      <label class="form-row">
        <span>补充说明（选填）</span>
        <textarea id="refundNote" rows="3" maxlength="1000" placeholder="可补充问题细节…"></textarea>
      </label>
      <p id="refundError" class="form-error" role="alert"></p>
      <div class="ticket-actions">
        <button id="cancelRefund" class="action-btn" type="button">取消</button>
        <button id="submitRefund" class="action-btn primary" type="submit">提交申请</button>
      </div>
    </form>
  </dialog>

  <dialog id="sourceDialog" class="source-dialog">
    <div class="source-head">
      <div>
        <p class="source-kicker">Citation</p>
        <h2 id="sourceTitle">引用来源</h2>
      </div>
      <button id="closeSource" class="dialog-close" type="button" aria-label="关闭">×</button>
    </div>
    <p class="source-meta">
      <span id="sourcePath"></span>
      <span id="sourceDoc"></span>
    </p>
    <p id="sourceQuestion" class="source-question"></p>
    <div id="sourceAnswer" class="source-answer"></div>
  </dialog>

  <script src="/static/chat.js?v=8"></script>
</body>
</html>
