[project]
name = "ecom-customer-service"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.139,<0.140",
  "uvicorn[standard]>=0.30",
  "langchain>=1.4,<2",
  "langchain-openai>=1.7,<2",
  "langgraph>=1.2,<2",
  "langgraph-checkpoint-sqlite>=2.0",
  "aiosqlite>=0.20",
  "pydantic-settings>=2.14,<3",
  "openai>=1.0",
  "sqlalchemy[asyncio]>=2.0,<2.1",
  "asyncmy>=0.2",
  "pymilvus[milvus_lite]>=2.5,<3",
  "langchain-text-splitters>=1.0,<2",
  "jieba>=0.42,<1",
  "httpx>=0.28",
  "cryptography>=42",
  "mcp>=1.30.0",
  "langchain-mcp-adapters>=0.3.2",
  "jsonschema>=4.26.0",
  "langfuse>=4.7,<5",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1", "httpx>=0.28"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
markers = ["integration: real upstream calls (requires OPENAI_API_KEY)"]
